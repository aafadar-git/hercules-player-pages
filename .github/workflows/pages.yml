name: Synthetic Pages prototype

on:
  workflow_dispatch:
    inputs:
      publication:
        description: Choose the reviewed publication mode
        type: choice
        options: [synthetic, interface-only]
        default: synthetic
        required: true
      confirm_interface_publication:
        description: Approve replacing the site with the disabled actual player interface only
        type: boolean
        required: true
        default: false
      confirm_synthetic_publication:
        description: Approve publishing only the synthetic page and fixture
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: synthetic-pages
  cancel-in-progress: false

jobs:
  assemble:
    if: ${{ github.ref == 'refs/heads/main' && ((inputs.publication == 'synthetic' && inputs.confirm_synthetic_publication && !inputs.confirm_interface_publication) || (inputs.publication == 'interface-only' && inputs.confirm_interface_publication && !inputs.confirm_synthetic_publication)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out publishing code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.3'
      - name: Check project path and validate synthetic assembly
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          node --input-type=module -e 'import { readFile } from "node:fs/promises"; const p = JSON.parse(await readFile("scripts/pages-policy.json")); if (p.projectPath !== "/" + process.env.REPOSITORY_NAME + "/") throw new Error("Reviewed repository/path mismatch");'
          node --test tests/pages-assembly.test.mjs
          node --test tests/interface-assembly.test.mjs
      - name: Assemble selected reviewed publication
        env:
          PUBLICATION: ${{ inputs.publication }}
        run: |
          case "$PUBLICATION" in
            synthetic) node scripts/assemble-pages.mjs "$RUNNER_TEMP/pages-site" ;;
            interface-only) node scripts/assemble-interface.mjs "$RUNNER_TEMP/pages-site" ;;
            *) exit 1 ;;
          esac
      - name: Upload selected reviewed Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-site
          retention-days: 1

  publish:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish selected reviewed site
        id: publish
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
